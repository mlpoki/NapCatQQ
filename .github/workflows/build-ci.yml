name: Repair OneKey installer fork download links
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repair-napcat-onekey-installer
  cancel-in-progress: false
jobs:
  repair:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch and run native installer before replacing the release ZIP
        run: python .github/scripts/repair_release.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: onekey-installer-link-repair-evidence
          path: repair-artifacts/*
          if-no-files-found: warn
          retention-days: 30
