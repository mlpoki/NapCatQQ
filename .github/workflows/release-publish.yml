name: Fork Release Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'New v* release tag; must point to the resolved main snapshot if it exists'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fork-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  resolve-main:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/github-script@v7
        id: resolve
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        with:
          script: await require('./.github/scripts/fork-release.cjs').resolve({github, context, core})

  preflight:
    needs: resolve-main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-main.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 20.x
      - run: node --test .github/scripts/fork-release.test.cjs
      - name: Validate workflow YAML with actionlint
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= -pyflakes= .github/workflows/release-publish.yml
          git diff --check

  build:
    needs: [resolve-main, preflight]
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows-x64
            runner: windows-latest
          - platform: Linux-x64
            runner: ubuntu-latest
          - platform: macOS-arm64
            runner: macos-15
    defaults:
      run:
        shell: bash
    env:
      SOURCE_SHA: ${{ needs.resolve-main.outputs.source_sha }}
      NAPCAT_VERSION: ${{ needs.resolve-main.outputs.release_tag }}
      QCE_VERSION: 6.4.3
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      NODE_OPTIONS: --max-old-space-size=4096
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-main.outputs.source_sha }}
          persist-credentials: false
      - name: Record build snapshot and runner architecture
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "source_branch=main source_sha=$SOURCE_SHA release_tag=$NAPCAT_VERSION workflow_sha=$GITHUB_WORKFLOW_SHA"
          uname -a
          if [ "$RUNNER_OS" = macOS ]; then test "$(uname -m)" = arm64; fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Python UTF-8 packaging output
        run: python -c "import sys; assert sys.flags.utf8_mode == 1; assert sys.stdout.encoding.lower().replace('-', '') == 'utf8'; print('Framework 模式优势：UTF-8 PASS')"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 20.x
      - name: Build fork NapCat and explicitly include builtin plugin
        run: |
          pnpm i
          pnpm --filter napcat-webui-frontend run build
          pnpm --filter napcat-plugin-builtin run build
          pnpm run build:framework
          pnpm run build:shell
          for kind in shell framework; do
            mkdir -p "packages/napcat-$kind/dist/plugins/napcat-plugin-builtin"
            cp -R packages/napcat-plugin-builtin/dist/. "packages/napcat-$kind/dist/plugins/napcat-plugin-builtin/"
            cp packages/napcat-plugin-builtin/package.json "packages/napcat-$kind/dist/plugins/napcat-plugin-builtin/"
            echo '{"napcat-plugin-builtin":true}' > "packages/napcat-$kind/dist/config/plugins.json"
            (cd "packages/napcat-$kind/dist" && npm pkg delete devDependencies && npm install --omit=dev)
          done
      - name: Sign packaged macOS native modules ad-hoc on arm64
        if: runner.os == 'macOS'
        run: |
          find packages/napcat-shell/dist/native packages/napcat-framework/dist/native -name '*darwin.arm64.node' -exec codesign --force --sign - {} \;
      # The pinned QCE tree contains an unconfigured .napcat-src gitlink.
      # Plain Git avoids checkout action's recursive credential cleanup; that
      # nested NapCat source is not used by QCE's release runtime packer.
      - name: Checkout and verify pinned QCE dependency without submodules
        run: |
          git init qce
          git -C qce remote add origin https://github.com/shuakami/qq-chat-exporter.git
          git -C qce fetch --depth=1 origin 4317f8c69b30c60bae47b543817b227665fa4f30
          git -C qce checkout --detach FETCH_HEAD
          test "$(git -C qce rev-parse HEAD)" = 4317f8c69b30c60bae47b543817b227665fa4f30
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux static Rust toolchain
        if: runner.os == 'Linux'
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: qce/qq-chat-export-server
          shared-key: fork-qce-${{ matrix.platform }}
      - name: Compile QCE server
        working-directory: qce/qq-chat-export-server
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          rustc --version
          cargo --version
          if [ "$RUNNER_OS" = Linux ]; then
            cargo build --locked --release --target x86_64-unknown-linux-musl
          else
            cargo build --locked --release
          fi
          if [ "$RUNNER_OS" = macOS ]; then codesign --force --sign - target/release/qce-server; fi
      - uses: pnpm/action-setup@v4
        with:
          version: 8
          run_install: false
      - name: Build QCE frontend with its separate pnpm version
        working-directory: qce/qce-v4-tool
        run: |
          pnpm install
          pnpm run build
      - name: Assemble current-run Shell QCE
        run: python .github/scripts/package-qce.py shell
      - name: Assemble current-run Framework QCE
        if: runner.os == 'Windows'
        run: python .github/scripts/package-qce.py framework
      - name: Assemble bundled QQ OneKey from fixed inputs
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/assemble-onekey.ps1
      - name: Unpack archives and validate native load and standalone HTTP
        run: python .github/scripts/validate-release.py
      - name: Verify Windows loader file queries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S .github/tests/windows-loader -B "$env:RUNNER_TEMP/windows-loader-test" -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "$env:RUNNER_TEMP/windows-loader-test" --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/windows-loader-test/Release/windows-loader-test.exe" "$pwd/OneKey/napcat/NapCatWinBootHook.dll" "$pwd/OneKey/napcat/loadNapCat.js"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [resolve-main, preflight, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-main.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - uses: actions/github-script@v7
        env:
          SOURCE_SHA: ${{ needs.resolve-main.outputs.source_sha }}
          RELEASE_TAG: ${{ needs.resolve-main.outputs.release_tag }}
        with:
          script: await require('./.github/scripts/fork-release.cjs').publish({github, context, core})
